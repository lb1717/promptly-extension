appId: com.promptlylabs.companion
productName: Promptly Labs
copyright: Copyright © Promptly Labs
protocols:
  name: Promptly Labs
  schemes:
    - promptly-labs
    - promptly-companion
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
extraMetadata:
  main: src/main.js
artifactName: Promptly-Labs-${version}-${os}.${ext}
mac:
  category: public.app-category.productivity
  extendInfo:
    CFBundleName: Promptly Labs
    CFBundleDisplayName: Promptly Labs
    LSUIElement: false
    NSMicrophoneUsageDescription: Promptly Labs uses the microphone for dictation when writing prompts.
  target:
    - dmg
    - zip
  icon: build/icon.png
  # Unsigned — electron-builder skips formal signing when identity is null.
  identity: null
  gatekeeperAssess: false
  hardenedRuntime: false
afterPack: ./scripts/after-pack.cjs
dmg:
  title: Promptly Labs
  iconSize: 96
  window:
    width: 660
    height: 320
  background: build/dmg-background.png
  contents:
    - x: 170
      y: 155
    - x: 470
      y: 155
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  shortcutName: Promptly Labs
linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Utility
